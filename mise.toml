[tools]
bun = "1.3.14"
lychee = "0.24.2"
# Hermes runs on Python 3.11 to 3.13; the plugins and scripts are tested on the same line.
python = "3.12"
shellcheck = "0.11.0"

[tasks.setup]
description = "Install the pinned dependencies"
run = "bun install --frozen-lockfile"

[tasks.format]
description = "Format the TypeScript sources"
run = "bun run format"

[tasks.format-check]
description = "Check formatting"
run = "bun run format:check"

[tasks.lint]
description = "Lint the TypeScript sources"
run = "bun run lint"

[tasks.typecheck]
description = "Type-check the validator and its tests"
run = "bun run typecheck"

[tasks.fleet]
description = "Validate the profile fleet against the contract"
run = "bun run src/validate-fleet.ts"

[tasks.test]
description = "Test the fleet contract, in memory and through the validator CLI"
run = "bun test"

[tasks.fleet-bundle]
description = "Check the validator bundle the host runs: reproducible and accepting this checkout"
run = "bun run src/check-fleet-validator.ts"

[tasks.build-validator]
description = "Write dist/validate-fleet.js and its SHA-256, for your infrastructure to install"
run = "bun run src/check-fleet-validator.ts --out=dist/validate-fleet.js"

[tasks.plugins]
description = "Unit-test the Hermes plugins"
run = "python -B -m unittest discover -s tests/plugins -p 'test_*.py'"

[tasks.scripts]
description = "Unit-test the cron scripts"
run = "python -B -m unittest discover -s tests/scripts -p 'test_*.py'"

[tasks.audit]
description = "Audit dependencies"
run = "bun run audit"

[tasks.shellcheck]
description = "Check the shell scripts"
run = "shellcheck scripts/*.sh"

[tasks.docs]
description = "Check repository-relative links in Markdown documentation"
run = "git ls-files -z '*.md' | xargs -0 lychee --offline --no-progress"

[tasks.check]
description = "Run all local repository validation"
depends = [
  "format-check",
  "lint",
  "typecheck",
  "fleet",
  "fleet-bundle",
  "test",
  "plugins",
  "scripts",
  "audit",
  "shellcheck",
  "docs",
]
