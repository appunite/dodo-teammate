[tools]
bun = "1.3.14"
lychee = "0.24.2"
# Hermes runs on Python 3.11 to 3.13; the agent's plugins and scripts are tested on the same line.
python = "3.12"
shellcheck = "0.11.0"

[tasks.setup]
description = "Install the pinned infrastructure dependencies"
run = "cd infra && bun install --frozen-lockfile"

[tasks.format]
description = "Format the infrastructure sources"
run = "cd infra && bun run format"

[tasks.format-check]
description = "Check infrastructure formatting"
run = "cd infra && bun run format:check"

[tasks.lint]
description = "Lint the infrastructure sources"
run = "cd infra && bun run lint"

[tasks.typecheck]
description = "Type-check the fleet validator"
run = "cd infra && bun run typecheck"

[tasks.fleet]
description = "Validate the Git-managed Hermes profile fleet"
run = "cd infra && bun run src/validate-fleet.ts"

[tasks.fleet-tests]
description = "Test the fleet validator against broken copies of the fleet"
run = "cd infra && bun test test/"

[tasks.fleet-bundle]
description = "Check the fleet validator bundle the host runs: reproducible and accepting this checkout"
run = "cd infra && bun run src/check-fleet-validator.ts"

[tasks.build-validator]
description = "Write the fleet validator bundle and its SHA-256 for your infrastructure to install"
run = "cd infra && mkdir -p dist && bun build src/validate-fleet.ts --target=bun --outfile dist/validate-fleet.js && sha256sum dist/validate-fleet.js > dist/validate-fleet.js.sha256"

[tasks.plugins]
description = "Unit-test the agent's Hermes plugins"
run = "python -B -m unittest discover -s tests/plugins -p 'test_*.py'"

[tasks.mcp-servers]
description = "Unit-test the agent's own stdio MCP servers"
run = "python -B -m unittest discover -s tests/mcp-servers -p 'test_*.py'"

[tasks.scripts]
description = "Unit-test the agent's cron scripts"
run = "python -B -m unittest discover -s tests/scripts -p 'test_*.py'"

[tasks.skills]
description = "Check the agent's own skills against the fleet they describe"
run = "python -B -m unittest discover -s tests/skills -p 'test_*.py'"

[tasks.audit]
description = "Audit infrastructure dependencies"
run = "cd infra && bun run audit"

[tasks.shellcheck]
description = "Check the reconciler, repository, skill, and cron shell scripts"
run = "shellcheck scripts/*.sh infra/assets/*.sh $(find shared/skills profiles -path '*/scripts/*.sh')"

[tasks.docs]
description = "Check repository-relative links in Markdown documentation"
run = "git ls-files -z '*.md' | xargs -0 lychee --offline --no-progress"

[tasks.check]
description = "Run all local repository validation"
depends = [
  "format-check",
  "lint",
  "typecheck",
  "fleet",
  "fleet-bundle",
  "fleet-tests",
  "plugins",
  "mcp-servers",
  "scripts",
  "skills",
  "audit",
  "shellcheck",
  "docs",
]
