schema_version: 6
# The owner's Slack user ID. The owner console's exception to the MCP egress rule holds only while
# its single allowed user is this ID. Replace the placeholder with your own ID.
owner_slack_id: U000OWNER

# The agent's reviewed policy. infra/src/validate-fleet.ts (copied verbatim from Dodo) enforces
# generic rules: a surface that reads MCP data has no egress, code runs only where no teammate can
# message, no delete tools, workers stay on their task. Everything specific to this agent that those
# rules check against lives here. It deploys with the profiles, so widening it is a reviewed change
# like any other in this file. scripts/rename-agent.sh replaces the placeholder `myagent` everywhere.
policy:
  # The owner's DM-only console: the one Slack profile that may keep web, vision, file, and terminal
  # next to its MCP servers, load restricted tools, and select a repository write skill, while its
  # only allowed user is owner_slack_id.
  owner_console: myagent-admin
  # Profiles whose model runs read client personal data: they deliver only to Slack DMs and select
  # nothing but skills, todo, and their own MCP servers.
  personal_data_profiles: []
  # Profiles that run no model: every surface selects only no_mcp, every job is no_agent, and no MCP
  # server, plugin, skill, or Kanban worker.
  model_free_profiles: []
  # Skills that hand a profile a write identity on GitHub. No profile teammates can message selects
  # one, except the owner console.
  repository_write_skills: [change-workflow]
  # The timezone of every profile that ships jobs, and of the default profile (an IANA name).
  timezone: Etc/UTC
  # Paths only the listed files may name (a README may describe them), such as where a write key
  # lives on the host.
  restricted_paths: {}
  # The deterministic Kanban hand-off: the plugin and the one Slack profile that ships it, and its
  # tools besides each worker's handoff_tool. Add pre_gateway_dispatch to hooks, with the exact
  # bot_mention_patterns, only if the plugin takes bot posts (Dodo's takes CI failure posts).
  handoff:
    plugin: myagent-handoff
    profile: myagent-slack
    tools: [handoff_result]
    hooks: []
    bot_mention_patterns: []
  # The hook plugin every Kanban worker ships, byte for byte the same in each.
  worker_guard: myagent-worker-guard
  # Credentials a root-owned broker on the host mints into the profiles whose brokered_env names
  # them (Dodo mints a GitHub read token this way). None in the starter fleet.
  brokered_credentials: []
  # Every credential a profile may declare in runtime_env, and the only profiles that may. A header
  # credential travels only as its server's one header, `Authorization: <header> ${NAME}`, to the
  # listed URLs. A script credential reaches only scripts, through terminal.env_passthrough; a
  # copy_of names the Slack key it duplicates for scripts, which Hermes never forwards. Any other
  # credential is read by a stdio server below and goes nowhere else.
  credentials:
    LINEAR_TEAM_TOKEN:
      profiles: [myagent-slack]
      header: Bearer
      urls:
        - https://mcp.linear.app/mcp
    # Sentry's hosted server reserves plain Bearer for its own OAuth tokens.
    SENTRY_READ_TOKEN:
      profiles: [myagent-slack]
      header: Sentry-Bearer
      urls:
        - https://mcp.sentry.dev/mcp/example-org?skills=inspect
    MYAGENT_SLACK_BOT_TOKEN:
      profiles: [myagent-scheduled]
      script: true
      copy_of: SLACK_BOT_TOKEN
  # Every remote MCP server a profile may declare, by exact URL, with every tool any profile may
  # load from it. Only the profiles in writers may load the tools in writes; a profile teammates can
  # message never loads restricted tools. Widening a list is a reviewed change here.
  mcp_servers:
    # Accepted risk (docs/myagent-capabilities/accepted-risks.md): the team profile writes issues
    # without an approval click. Controls: the user allowlist, these writes, no delete tools, every
    # write reported.
    - url: https://mcp.linear.app/mcp
      tools: [get_issue, list_comments, list_issue_labels, list_issues, list_teams, save_comment,
        save_issue]
      writes: [save_comment, save_issue]
      writers: [myagent-slack]
    # Replace example-org with your Sentry organisation slug; ?skills=inspect loads read tools only.
    - url: https://mcp.sentry.dev/mcp/example-org?skills=inspect
      tools: [find_projects, get_sentry_resource, search_errors, search_issues]
  # Every stdio server a profile may run: a root-owned wrapper (command), or one of the agent's own
  # servers in shared/mcp-servers/<name>/server.py. None in the starter fleet; Dodo runs a GitHub
  # read wrapper and two of its own servers.
  stdio_servers: {}

# The Hermes launch profile. It holds the host-wide Slack policy and the Kanban dispatcher, and no
# capability credentials.
default_profile:
  name: default
  source: profiles/default
  desired_state: present
  gateway: false
  kanban_worker: false
  cron: []
  delivery_targets: []
  platform_toolsets:
    cli: [clarify, web, vision, skills, todo, memory, session_search, no_mcp]
    api_server: [clarify, web, vision, skills, todo, memory, session_search, no_mcp]
    slack: [no_mcp]
    cron: [no_mcp]
  mcp_servers: {}
  plugins: {}
  runtime_env: []
  brokered_env: []
  dodo_skills: [authority-boundaries, evidence-and-provenance, untrusted-input]
  raven_skills: []
  hermes_skills: []
  terminal_home_mode: auto

profiles:
  # The owner's private console: a DM-only Slack app with exactly one allowed user. It keeps memory,
  # web, and a host terminal, which is safe only while the owner alone can reach it.
  - name: myagent-admin
    source: profiles/myagent-admin
    desired_state: installed
    alias: true
    gateway: slack
    kanban_worker: false
    cron: []
    delivery_targets: []
    platform_toolsets:
      cli: [clarify, web, vision, file, terminal, skills, todo, memory, session_search, no_mcp]
      api_server: [clarify, web, vision, file, terminal, skills, todo, memory, session_search, no_mcp]
      slack: [clarify, web, vision, file, terminal, skills, todo, memory, session_search, no_mcp]
      cron: [no_mcp]
    mcp_servers: {}
    plugins: {}
    runtime_env: []
    brokered_env: []
    dodo_skills:
      - authority-boundaries
      - change-workflow
      - evidence-and-provenance
      - myagent-capabilities
      - untrusted-input
    raven_skills: []
    hermes_skills: []
    terminal_home_mode: auto

  # The team's front door: allowlisted teammates, allowed channels, read tools plus one reviewed write
  # (Linear issues), no memory, no web or vision next to private data, and typed hand-offs to workers.
  - name: myagent-slack
    source: profiles/myagent-slack
    desired_state: installed
    alias: true
    gateway: slack
    kanban_worker: false
    cron: []
    delivery_targets: []
    platform_toolsets:
      cli: [clarify, skills, todo, linear, sentry]
      api_server: [clarify, skills, todo, linear, sentry]
      slack: [clarify, skills, todo, myagent_handoff, linear, sentry]
      cron: [no_mcp]
    mcp_servers:
      linear:
        url: https://mcp.linear.app/mcp
        strict_redirect_headers: true
        headers:
          Authorization: Bearer ${LINEAR_TEAM_TOKEN}
        tools:
          include: [list_teams, list_issue_labels, list_issues, get_issue, list_comments, save_issue,
            save_comment]
          resources: false
          prompts: false
        sampling:
          enabled: false
        elicitation:
          enabled: false
        trust: full
        timeout: 60
      sentry:
        # Replace example-org with your Sentry organisation slug. ?skills=inspect loads read tools only.
        url: https://mcp.sentry.dev/mcp/example-org?skills=inspect
        strict_redirect_headers: true
        headers:
          Authorization: Sentry-Bearer ${SENTRY_READ_TOKEN}
        tools:
          include: [find_projects, search_issues, search_errors, get_sentry_resource]
          resources: false
          prompts: false
        sampling:
          enabled: false
        elicitation:
          enabled: false
        trust: full
        timeout: 120
    plugins:
      myagent-handoff:
        toolset: myagent_handoff
        tools: [handoff_result, handoff_document]
    runtime_env: [LINEAR_TEAM_TOKEN, SENTRY_READ_TOKEN]
    brokered_env: []
    dodo_skills:
      - authority-boundaries
      - evidence-and-provenance
      - myagent-capabilities
      - untrusted-input
    raven_skills: []
    hermes_skills: []
    terminal_home_mode: auto

  # Reviewed schedules, posting as the team app without Socket Mode: nobody can message it.
  - name: myagent-scheduled
    source: profiles/myagent-scheduled
    desired_state: installed
    alias: true
    gateway: slack_outbound
    kanban_worker: false
    cron: [standup-reminder]
    # The owner's DM with the team app, for failure alerts. Replace with your own DM channel ID.
    delivery_targets: ["slack:D000OWNERDM"]
    platform_toolsets:
      cli: [skills, todo, no_mcp]
      api_server: [skills, todo, no_mcp]
      slack: [no_mcp]
      cron: [skills, todo, no_mcp]
    mcp_servers: {}
    plugins: {}
    # Hermes passes no SLACK_* key to a script, so the script reads the team app's bot token under
    # this name too (policy.credentials, copy_of).
    runtime_env: [MYAGENT_SLACK_BOT_TOKEN]
    brokered_env: []
    dodo_skills: [authority-boundaries, untrusted-input]
    raven_skills: []
    hermes_skills: []
    terminal_home_mode: auto

  # A Kanban worker. Nothing reaches it but a task the team profile's handoff_document builds.
  - name: myagent-writer
    source: profiles/myagent-writer
    desired_state: installed
    alias: true
    gateway: false
    kanban_worker:
      handoff_tool: handoff_document
      max_runtime_seconds: 900
      max_retries: 1
    cron: []
    delivery_targets: []
    platform_toolsets:
      cli: [skills, todo, file, no_mcp]
      api_server: [no_mcp]
      slack: [no_mcp]
      cron: [no_mcp]
    mcp_servers: {}
    plugins:
      myagent-worker-guard:
        hooks: [pre_tool_call]
    runtime_env: []
    brokered_env: []
    dodo_skills: [evidence-and-provenance, untrusted-input]
    raven_skills: []
    hermes_skills: []
    terminal_home_mode: auto
