# A Kanban worker: nothing reaches it but a task the team profile's handoff_document creates, which
# the dispatcher runs as `hermes -p myagent-writer --cli chat -q` with the cli surface's toolsets.
platform_toolsets:
  cli: [skills, todo, file, no_mcp]
  api_server: [no_mcp]
  slack: [no_mcp]
  cron: [no_mcp]
agent:
  # Every unselected built-in toolset but kanban: the dispatcher adds kanban to a worker, and this
  # list is subtracted last, so listing it would take kanban_complete away (Dodo: derek-ci).
  disabled_toolsets:
    - bot_room
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - desktop_ui
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - homeassistant
    - image_gen
    - memory
    - project
    - search
    - session_search
    - setup
    - spotify
    - stt
    - terminal
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
  max_turns: 30
  run_budget_seconds: 600
# A chat -q run gates commands with single_query_mode.
approvals:
  mode: manual
  single_query_mode: deny
mcp_servers: {}
# Exactly the plugins this profile ships; an absent key would let Hermes keep installed ones
# (Dodo: profiles/*/config.yaml).
plugins:
  enabled: [myagent-worker-guard]
skills:
  external_dirs:
    - /var/lib/hermes/.myagent-deployment/skills/myagent-writer
security:
  redact_secrets: true
# file runs on the host as hermes, in the task's workspace. No container: see docs/accepted-risks.md.
terminal:
  backend: local
  home_mode: auto
